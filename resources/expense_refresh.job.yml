resources:
  jobs:
    expense_refresh:
      name: ${bundle.target}_penny_lake_expense_refresh
      max_concurrent_runs: 1
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/${var.catalog}/${var.landing_schema}/${var.transactions_volume}/
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: ingest_bronze
          notebook_task:
            notebook_path: ../src/bronze_ingest.py
            base_parameters:
              bronze_catalog: ${var.catalog}
              table_schema: ${var.schema}
              landing_schema: ${var.landing_schema}
              transactions_volume: ${var.transactions_volume}
              autoloader_state_volume: ${var.autoloader_state_volume}
          max_retries: 2
          min_retry_interval_millis: 30000
        - task_key: refresh_silver
          depends_on:
            - task_key: ingest_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.penny_lake_silver.id}
        - task_key: refresh_gold
          depends_on:
            - task_key: refresh_silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.penny_lake_gold.id}
        - task_key: apply_governance
          depends_on:
            - task_key: refresh_gold
          notebook_task:
            notebook_path: ../src/apply_governance.py
            base_parameters:
              bronze_catalog: ${var.catalog}
              silver_catalog: ${var.silver_catalog}
              gold_catalog: ${var.gold_catalog}
              governance_catalog: ${var.governance_catalog}
              schema: ${var.schema}
              gold_reader_principal: ${var.gold_reader_principal}
