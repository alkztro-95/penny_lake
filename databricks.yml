# This is a Declarative Automation Bundle definition for penny_lake.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: penny_lake
  uuid: 94a197ee-d18a-49b6-8902-49479627f3a1

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the targets below.
variables:
  catalog:
    description: The bronze catalog and default pipeline catalog
  silver_catalog:
    description: The silver catalog
  gold_catalog:
    description: The gold catalog
  governance_catalog:
    description: Catalog for access mappings and governance functions
  gold_reader_principal:
    description: Workspace principal that can read Gold without seeing monetary amounts
  catalog_full_access_principal:
    description: Principal that receives full access to each environment's catalogs
    default: alfredo.castro@ulatina.net
  schema:
    description: The schema to create in each medallion catalog
  landing_schema:
    description: The schema for source files in the bronze catalog
    default: landing
  transactions_volume:
    description: The managed Volume for transaction JSON files
    default: transactions_volume
  autoloader_state_volume:
    description: Managed Volume for Auto Loader schema and checkpoint state
    default: autoloader_state
  usd_to_crc_rate:
    description: Estimated fixed CRC per USD rate; changing it requires a silver full refresh
    default: "500"

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-7c7fae20-e5c4.cloud.databricks.com
    variables:
      catalog: dev_penny_lake_01_bronze
      silver_catalog: dev_penny_lake_02_silver
      gold_catalog: dev_penny_lake_03_gold
      governance_catalog: dev_penny_lake_04_governance
      gold_reader_principal: alkztro@hotmail.com
      schema: expenses
  test:
    mode: production
    workspace:
      host: https://dbc-7c7fae20-e5c4.cloud.databricks.com
      root_path: /Workspace/Users/cb2f526a-1a03-47da-a4f6-30729febe372/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: test_penny_lake_01_bronze
      silver_catalog: test_penny_lake_02_silver
      gold_catalog: test_penny_lake_03_gold
      governance_catalog: test_penny_lake_04_governance
      gold_reader_principal: alkztro@hotmail.com
      schema: expenses
    permissions:
      - service_principal_name: cb2f526a-1a03-47da-a4f6-30729febe372
        level: CAN_MANAGE
      - user_name: alfredo.castro@ulatina.net
        level: CAN_MANAGE
  prod:
    mode: production
    workspace:
      host: https://dbc-7c7fae20-e5c4.cloud.databricks.com
      root_path: /Workspace/Users/76668225-6dad-4f36-bc24-e9b41f811953/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod_penny_lake_01_bronze
      silver_catalog: prod_penny_lake_02_silver
      gold_catalog: prod_penny_lake_03_gold
      governance_catalog: prod_penny_lake_04_governance
      gold_reader_principal: alkztro@hotmail.com
      schema: expenses
    permissions:
      - service_principal_name: 76668225-6dad-4f36-bc24-e9b41f811953
        level: CAN_MANAGE
      - user_name: alfredo.castro@ulatina.net
        level: CAN_MANAGE
